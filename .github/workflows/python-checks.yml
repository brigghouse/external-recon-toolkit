name: Python Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Syntax and smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all tool scripts (syntax check)
        run: python -m compileall tools

      - name: Smoke test — Domain Doctor --help
        run: python tools/bsl_domain_doctor.py --help

      - name: Smoke test — Web Surface Auditor --help
        run: python tools/bsl_web_surface_auditor.py --help

      - name: Smoke test — Passive Asset Mapper --help
        run: python tools/bsl_passive_asset_mapper.py --help
